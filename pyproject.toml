[project]
name = "flowcast"
version = "0.1.0"
description = "Restaurant flow forecasting, staffing, and ordering engine driven by weather, school calendars, holidays, events, and POS history."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "holidays>=0.60",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
flowcast = "flowcast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowcast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
